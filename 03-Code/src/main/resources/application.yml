spring:
  application:
    name: checkout
  datasource:
    url: jdbc:h2:mem:checkout;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  thymeleaf:
    cache: false

server:
  port: 8080

# Stage 5 — actuator + Prometheus scrape endpoint
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: checkout

logging:
  pattern:
    level: "%5p [%X{cartId},%X{idempotencyKey},%X{orderId}]"
  level:
    com.example.checkout: INFO
