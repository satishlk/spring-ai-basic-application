<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <title>Order confirmed</title>
  <style>
    body { font-family: system-ui, sans-serif; background:#f6f7fb; padding:60px 20px; text-align:center; }
    .card { max-width:480px; margin:0 auto; background:#fff; border-radius:14px;
            padding:36px; box-shadow:0 6px 24px rgba(0,0,0,.06); }
    h1 { color:#047857; margin:0 0 14px; }
    dl { text-align:left; margin-top:18px; }
    dt { color:#6b7280; font-size:12px; margin-top:10px; }
    dd { margin:2px 0 0; font-size:15px; font-weight:600; }
  </style>
</head>
<body>
<div class="card">
  <h1>✅ Payment successful</h1>
  <p>Thanks — your order is confirmed.</p>
  <dl>
    <dt>Order ID</dt>      <dd th:text="${order.id}"></dd>
    <dt>Amount</dt>        <dd><span th:text="${order.currency}"></span> <span th:text="${order.amount}"></span></dd>
    <dt>Card</dt>          <dd>•••• <span th:text="${order.last4}"></span></dd>
    <dt>Transaction ID</dt><dd th:text="${order.transactionId}"></dd>
  </dl>
</div>
</body>
</html>
