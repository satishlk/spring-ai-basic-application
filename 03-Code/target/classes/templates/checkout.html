<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <title>Checkout</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background:#f6f7fb; margin:0; padding:40px; }
    .card { max-width:560px; margin:0 auto; background:#fff; border-radius:14px;
            padding:28px 32px; box-shadow:0 6px 24px rgba(0,0,0,.06); }
    h1 { margin:0 0 20px; font-size:22px; }
    table { width:100%; border-collapse:collapse; margin-bottom:18px; }
    th, td { text-align:left; padding:8px 0; border-bottom:1px solid #eef0f4; font-size:14px; }
    .total { font-weight:600; font-size:16px; }
    label { display:block; font-size:12px; color:#586076; margin:12px 0 4px; }
    input { width:100%; box-sizing:border-box; padding:10px 12px; border:1px solid #d4d8e0;
            border-radius:8px; font-size:14px; }
    button { margin-top:18px; width:100%; padding:12px; border:0; border-radius:10px;
             background:#4f46e5; color:#fff; font-size:15px; font-weight:600; cursor:pointer; }
    button:hover { background:#4338ca; }
    #msg { margin-top:14px; font-size:13px; }
    .err { color:#b91c1c; }
    .ok  { color:#047857; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Checkout</h1>

    <table>
      <thead><tr><th>Item</th><th>Qty</th><th style="text-align:right">Price</th></tr></thead>
      <tbody>
        <tr th:each="it : ${cart.items}">
          <td th:text="${it.name}"></td>
          <td th:text="${it.qty}"></td>
          <td style="text-align:right" th:text="${it.unitPrice}"></td>
        </tr>
      </tbody>
      <tfoot>
        <tr class="total">
          <td colspan="2">Grand total</td>
          <td style="text-align:right">
            <span th:text="${cart.currency}">INR</span>
            <span th:text="${grandTotal}">0.00</span>
          </td>
        </tr>
      </tfoot>
    </table>

    <form id="payForm">
      <input type="hidden" name="cartId" th:value="${cart.cartId}">
      <label>Card number</label>
      <input name="cardNumber" maxlength="16" placeholder="4111111111111111" required>
      <label>Expiry</label>
      <input name="expiry" placeholder="12/29" required>
      <label>CVV</label>
      <input name="cvv" maxlength="3" placeholder="123" required>
      <label>Name on card</label>
      <input name="cardholderName" required>
      <button type="submit">Pay</button>
    </form>
    <div id="msg"></div>
  </div>

<script>
  // Generate one idempotency key per page load (FR-3).
  const idem = crypto.randomUUID();

  document.getElementById('payForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const msg = document.getElementById('msg');
    msg.className = ''; msg.textContent = 'Processing…';

    const data = Object.fromEntries(new FormData(e.target).entries());
    try {
      const r = await fetch('/api/checkout/pay', {
        method: 'POST',
        headers: {'Content-Type':'application/json', 'Idempotency-Key': idem},
        body: JSON.stringify(data)
      });
      const j = await r.json();
      if (r.ok) {
        msg.className = 'ok';
        msg.textContent = '✅ Paid — order ' + j.orderId;
        setTimeout(() => location.href = '/checkout/success/' + j.orderId, 700);
      } else if (r.status === 402) {
        msg.className = 'err';
        msg.textContent = '❌ Declined: ' + (j.reason || 'unknown');
      } else if (r.status === 504) {
        msg.className = 'err';
        msg.textContent = '⏱ Gateway timed out — please retry (your same key is safe)';
      } else {
        msg.className = 'err';
        msg.textContent = '❌ ' + (j.message || JSON.stringify(j.fields || j));
      }
    } catch (err) {
      msg.className = 'err';
      msg.textContent = '❌ Network error: ' + err;
    }
  });
</script>
</body>
</html>
