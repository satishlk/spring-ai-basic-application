<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>AI Pipeline Orchestrator — Audit Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      --bg: #0f172a; --panel: #1e293b; --panel-2: #334155;
      --txt: #e2e8f0; --txt-2: #94a3b8; --accent: #6366f1;
      --ok: #10b981; --bad: #ef4444; --warn: #f59e0b; --info: #3b82f6;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
           background: var(--bg); color: var(--txt); }
    header { padding: 18px 24px; background: var(--panel); display: flex;
             align-items: center; justify-content: space-between; border-bottom: 1px solid #334155; }
    header h1 { margin: 0; font-size: 18px; letter-spacing: -.01em; }
    .nav-link { color: var(--txt-2); text-decoration: none; font-size: 13px;
                padding: 6px 12px; border-radius: 6px; transition: all .15s; }
    .nav-link:hover { background: #334155; color: var(--txt); }
    .nav-link.active { background: var(--accent); color: white; }
    header .conn { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--txt-2); }
    header .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--warn); }
    header .dot.ok { background: var(--ok); animation: pulse 1.6s infinite; }
    header .dot.bad { background: var(--bad); }
    @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: 0.4 } }

    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
             gap: 12px; padding: 18px 24px; }
    .stat { background: var(--panel); border-radius: 10px; padding: 14px 16px;
            border: 1px solid #334155; }
    .stat .label { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--txt-2); }
    .stat .value { font-size: 26px; font-weight: 600; margin-top: 4px; font-variant-numeric: tabular-nums; }
    .stat .sub   { font-size: 11px; color: var(--txt-2); margin-top: 2px; }

    .feed { padding: 0 24px 24px; }
    .feed h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em;
               color: var(--txt-2); margin: 24px 0 12px; }
    .ev { background: var(--panel); border-radius: 10px; padding: 12px 16px;
          margin-bottom: 10px; border: 1px solid #334155; border-left: 3px solid var(--info); }
    .ev.ACCEPTED  { border-left-color: var(--info); }
    .ev.RUNNING   { border-left-color: var(--warn); }
    .ev.COMPLETED { border-left-color: var(--ok); }
    .ev.FAILED, .ev.REJECTED { border-left-color: var(--bad); }

    .ev .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .ev .state { font-size: 10px; font-weight: 700; letter-spacing: .08em;
                 padding: 3px 8px; border-radius: 4px; background: var(--panel-2); }
    .ev .state.RUNNING   { background: var(--warn); color: #1e293b; }
    .ev .state.COMPLETED { background: var(--ok);   color: #052e2b; }
    .ev .state.FAILED, .ev .state.REJECTED { background: var(--bad); color: #fff; }
    .ev .type    { font-weight: 600; }
    .ev .corr    { font-family: ui-monospace, monospace; color: var(--txt-2); font-size: 11px; }
    .ev .when    { color: var(--txt-2); font-size: 12px; margin-left: auto; font-variant-numeric: tabular-nums; }
    .ev .dur     { color: var(--txt-2); font-size: 12px; }

    .ev .task    { color: var(--txt-2); margin-top: 6px; font-size: 13px;
                   white-space: pre-wrap; word-break: break-word; }
    .ev .tools   { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; }
    .ev .tool    { background: var(--panel-2); border-radius: 4px; padding: 3px 8px;
                   font-size: 11px; font-family: ui-monospace, monospace; color: var(--txt); }
    .ev .tool.err { background: var(--bad); }
    .ev .err    { margin-top: 6px; color: #fca5a5; font-size: 12px; font-family: ui-monospace, monospace; }
    .ev a.pr    { color: var(--accent); font-size: 12px; }

    footer { padding: 16px 24px; color: var(--txt-2); font-size: 11px; text-align: center;
             border-top: 1px solid #334155; }
    footer code { background: var(--panel); padding: 2px 6px; border-radius: 4px; }
  </style>
</head>
<body>
  <header>
    <div style="display:flex;align-items:center;gap:24px;">
      <h1>🧭 AI Pipeline Orchestrator</h1>
      <nav style="display:flex;gap:16px;">
        <a href="/dashboard.html" class="nav-link active">📊 Audit timeline</a>
        <a href="/agents.html"    class="nav-link">🤖 Deployed agents</a>
      </nav>
    </div>
    <div class="conn">
      <span id="dot" class="dot"></span>
      <span id="conn-text">connecting…</span>
    </div>
  </header>

  <section class="stats">
    <div class="stat"><div class="label">Total runs</div>     <div class="value" id="s-total">0</div></div>
    <div class="stat"><div class="label">Running now</div>    <div class="value" id="s-running" style="color: var(--warn)">0</div></div>
    <div class="stat"><div class="label">Completed ✅</div>   <div class="value" id="s-completed" style="color: var(--ok)">0</div></div>
    <div class="stat"><div class="label">Failed ❌</div>      <div class="value" id="s-failed" style="color: var(--bad)">0</div></div>
    <div class="stat"><div class="label">Tool calls</div>     <div class="value" id="s-tools">0</div></div>
    <div class="stat"><div class="label">Avg dur</div>        <div class="value" id="s-avg">—</div>
                                                              <div class="sub" id="s-minmax"></div></div>
  </section>

  <section class="feed">
    <h2>Live event timeline</h2>
    <div id="events"></div>
  </section>

  <footer>
    SSE stream: <code>/api/audit/stream</code> · REST snapshots: <code>/api/audit/recent</code>, <code>/api/audit/stats</code> · Prometheus: <code>/actuator/prometheus</code>
  </footer>

<script>
const $ = id => document.getElementById(id);

function fmtTime(iso) {
  if (!iso) return '—';
  return new Date(iso).toLocaleTimeString();
}
function fmtMs(ms) {
  if (ms == null) return '—';
  if (ms < 1000) return ms + 'ms';
  return (ms / 1000).toFixed(1) + 's';
}

function renderEvent(ev) {
  const id = 'ev-' + ev.correlationId;
  let el = document.getElementById(id);
  if (!el) {
    el = document.createElement('div');
    el.id = id;
    el.className = 'ev';
    $('events').insertBefore(el, $('events').firstChild);
  }
  el.className = 'ev ' + ev.state;

  const tools = (ev.toolCalls || [])
    .map(t => `<span class="tool ${t.error ? 'err' : ''}" title="${(t.error || 'ok')}">${t.name.replace(/^spring_ai_mcp_client_[^_]+_/, '')}${t.durationMs ? ' · ' + fmtMs(t.durationMs) : ''}</span>`)
    .join('');

  el.innerHTML = `
    <div class="row">
      <span class="state ${ev.state}">${ev.state}</span>
      <span class="type">${ev.eventType}</span>
      <span class="corr">${ev.correlationId.slice(0, 8)}…</span>
      <span class="when">${fmtTime(ev.acceptedAt)}</span>
      <span class="dur">${fmtMs(ev.durationMs ?? null)}</span>
    </div>
    <div class="task">${escapeHtml(ev.task || '')}</div>
    ${tools ? `<div class="tools">${tools}</div>` : ''}
    ${ev.prUrl ? `<a class="pr" href="${ev.prUrl}" target="_blank">→ PR</a>` : ''}
    ${ev.error ? `<div class="err">${escapeHtml(ev.error)}</div>` : ''}
  `;
}

function escapeHtml(s) {
  return (s ?? '').toString()
      .replaceAll('&', '&amp;').replaceAll('<', '&lt;')
      .replaceAll('>', '&gt;').replaceAll('"', '&quot;');
}

async function loadStats() {
  try {
    const r = await fetch('/api/audit/stats');
    const s = await r.json();
    $('s-total').textContent     = s.total;
    $('s-running').textContent   = s.running;
    $('s-completed').textContent = s.completed;
    $('s-failed').textContent    = s.failed;
    $('s-tools').textContent     = s.toolCalls;
    $('s-avg').textContent       = s.avgDurMs ? fmtMs(s.avgDurMs) : '—';
    $('s-minmax').textContent    = s.completed ? `min ${fmtMs(s.minDurMs)} · max ${fmtMs(s.maxDurMs)}` : '';
  } catch (e) { /* ignore */ }
}

async function loadRecent() {
  const r = await fetch('/api/audit/recent');
  const list = await r.json();
  $('events').innerHTML = '';
  list.forEach(renderEvent);
}

let _es = null;
let _reconnectDelay = 1500;

function connect() {
  if (_es) { try { _es.close(); } catch {} }
  _es = new EventSource('/api/audit/stream');

  _es.addEventListener('audit', e => {
    const ev = JSON.parse(e.data);
    renderEvent(ev);
    loadStats();
  });

  _es.onopen = () => {
    $('dot').className = 'dot ok'; $('conn-text').textContent = 'live';
    _reconnectDelay = 1500;     // reset backoff after successful connect
  };

  _es.onerror = () => {
    $('dot').className = 'dot bad'; $('conn-text').textContent = 'reconnecting…';
    try { _es.close(); } catch {}
    _es = null;
    setTimeout(connect, _reconnectDelay);
    _reconnectDelay = Math.min(_reconnectDelay * 2, 15000); // exp backoff capped at 15s
  };
}

// Close the SSE subscription cleanly when the tab is hidden/closed —
// prevents server-side "Broken pipe" log noise on every reload.
window.addEventListener('beforeunload', () => { if (_es) try { _es.close(); } catch {} });

// Initial load + SSE wiring
loadRecent().then(loadStats).then(connect);
setInterval(loadStats, 5000);   // periodic stat refresh as a belt-and-suspenders
</script>
</body>
</html>
